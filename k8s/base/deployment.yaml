apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ledger-app
  labels:
    app: kafka-ledger
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kafka-ledger
  template:
    metadata:
      labels:
        app: kafka-ledger
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka-ledger
          image: kafka-ledger-learning:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-ledger-config
                  key: bootstrap-servers
            - name: SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: kafka-ledger-config
                  key: schema-registry-url
          volumeMounts:
            - name: state-store
              mountPath: /var/kafka-streams
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: state-store
          emptyDir: {}

