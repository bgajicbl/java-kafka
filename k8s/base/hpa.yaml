# Kafka Streams scales by partition, and every scale event triggers a rebalance plus state
# migration. So: target the StatefulSet, cap replicas at the input partition count (6 —
# extra instances would sit idle), scale on CPU only (JVM heap never shrinks, so a memory
# target blocks scale-down), and damp both directions to avoid rebalance storms.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-ledger-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: kafka-ledger-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 600
